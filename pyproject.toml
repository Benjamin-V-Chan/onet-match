[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onet-match"
version = "0.3.0"
description = "Map free text (job titles, resume lines, projects, interests, skills) to O*NET occupations with skills, tasks and calibrated confidence."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benjamin Chan" }]
keywords = ["onet", "o*net", "occupations", "soc-codes", "job-title-normalization", "occupation-classification",
            "semantic-search", "job-matching", "resume-parsing", "career-exploration", "skills-taxonomy",
            "sentence-transformers", "embeddings", "reranker", "riasec"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
]
dependencies = [
    "pandas>=1.3",
    "numpy>=1.21",
    "scikit-learn>=1.1",
    "matplotlib>=3.5",
    "pyarrow>=12",
]

[project.optional-dependencies]
plots = ["seaborn>=0.12"]
# Dense retrieval, fine-tuning and reranking (TF-IDF/BM25 matching needs none of this).
matching = ["torch>=2.2", "sentence-transformers[train]>=5.0", "transformers>=4.41", "huggingface_hub>=0.23"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2"]
synth = ["anthropic>=0.70", "openai>=1.40"]
dev = ["pytest>=7", "seaborn>=0.12", "httpx>=0.27", "onet-match[matching,serve,synth]"]

[project.scripts]
onet-match = "onet_analysis.cli:main"
onet-analyze = "onet_analysis.cli:main"
onet-collect = "onet_data_collector.cli:main"

[project.urls]
Homepage = "https://github.com/Benjamin-V-Chan/onet-match"
Repository = "https://github.com/Benjamin-V-Chan/onet-match"
Documentation = "https://github.com/Benjamin-V-Chan/onet-match/tree/main/docs"

[tool.setuptools.packages.find]
include = ["onet_match*", "onet_analysis*", "onet_data_collector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
